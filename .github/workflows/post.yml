name: Kanalga post yuborish

on:
  schedule:
    # 05:00 UTC = Toshkent vaqti bilan 10:00
    - cron: '0 5 * * *'
  workflow_dispatch:        # Qo'lda ishga tushirish tugmasi

permissions:
  contents: write           # yuborilgan.txt ni qaytib yozish uchun

concurrency:
  group: post-yuborish
  cancel-in-progress: false

jobs:
  yubor:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v5

      - name: Python o'rnatish
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Secretlarni tekshirish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          KANAL: ${{ secrets.KANAL }}
        run: |
          xato=0
          if [ -z "$BOT_TOKEN" ]; then
            echo "::error::BOT_TOKEN secret topilmadi yoki bo'sh."
            xato=1
          else
            echo "BOT_TOKEN: topildi (${#BOT_TOKEN} belgi)"
          fi
          if [ -z "$KANAL" ]; then
            echo "::error::KANAL secret topilmadi yoki bo'sh."
            xato=1
          else
            echo "KANAL: $KANAL"
          fi
          exit $xato

      - name: Postni yuborish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          KANAL: ${{ secrets.KANAL }}
        run: python yubor.py

      - name: Holatni saqlash
        run: |
          git config user.name  "Sofia Expert Bot"
          git config user.email "actions@github.com"
          git add yuborilgan.txt jurnal.log
          if git diff --staged --quiet; then
            echo "O'zgarish yo'q, saqlash shart emas."
          else
            git commit -m "Post yuborildi: $(date -u '+%Y-%m-%d')"
            if ! git push; then
              echo "::error::GitHub'ga yozib bo'lmadi. Settings -> Actions -> Workflow permissions -> 'Read and write permissions' ni yoqing."
              exit 1
            fi
          fi
