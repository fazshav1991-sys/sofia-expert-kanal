name: Kanalga post yuborish

on:
  schedule:
    # UTC vaqti. Toshkent = UTC + 5 soat.
    # 04:00->09:00  07:00->12:00  10:00->15:00  13:00->18:00  16:00->21:00
    - cron: '0 4,7,10,13,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post-yuborish
  cancel-in-progress: false

jobs:
  yubor:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v5

      - name: Python o'rnatish
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Kutubxonalarni o'rnatish
        id: kutubxona
        run: |
          echo "## 📦 Kutubxonalar" >> $GITHUB_STEP_SUMMARY
          if pip install -r requirements.txt > /tmp/pip.log 2>&1; then
            echo "✅ O'rnatildi" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ O'rnatilmadi:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -25 /tmp/pip.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Secretlarni tekshirish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          KANAL: ${{ secrets.KANAL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          echo "## 🔑 Secretlar" >> $GITHUB_STEP_SUMMARY
          echo "| Secret | Holat |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          xato=0

          if [ -z "$BOT_TOKEN" ]; then
            echo "| BOT_TOKEN | ❌ **TOPILMADI yoki bo'sh** |" >> $GITHUB_STEP_SUMMARY
            xato=1
          else
            toza=$(printf '%s' "$BOT_TOKEN" | tr -d '[:space:]')
            if [ ${#BOT_TOKEN} -ne ${#toza} ]; then
              echo "| BOT_TOKEN | ⚠️ ${#BOT_TOKEN} belgi, ichida $(( ${#BOT_TOKEN} - ${#toza} )) ta ko'rinmas belgi bor (kod avtomatik tozalaydi) |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| BOT_TOKEN | ✅ ${#BOT_TOKEN} belgi (46 bo'lishi kerak) |" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          if [ -z "$KANAL" ]; then
            echo "| KANAL | ❌ **TOPILMADI yoki bo'sh** |" >> $GITHUB_STEP_SUMMARY
            xato=1
          else
            echo "| KANAL | ✅ \`$KANAL\` |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "| ANTHROPIC_API_KEY | ⚠️ yo'q (AI postlar ishlamaydi) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ANTHROPIC_API_KEY | ✅ ${#ANTHROPIC_API_KEY} belgi |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -z "$PEXELS_API_KEY" ]; then
            echo "| PEXELS_API_KEY | ⚠️ yo'q (rasmsiz chiqadi) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| PEXELS_API_KEY | ✅ ${#PEXELS_API_KEY} belgi |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ $xato -ne 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> ❌ Majburiy secret yetishmayapti — to'xtatildi." >> $GITHUB_STEP_SUMMARY
          fi
          exit $xato

      - name: Postni yuborish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          KANAL: ${{ secrets.KANAL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          echo "## 📨 Post yuborish" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          set +e
          python kunlik.py 2>&1 | tee /tmp/post.log
          kod=${PIPESTATUS[0]}
          set -e
          cat /tmp/post.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ $kod -ne 0 ]; then
            echo "> ❌ Yuborilmadi (kod $kod). Yuqoridagi matn sababini ko'rsatadi." >> $GITHUB_STEP_SUMMARY
          else
            echo "> ✅ Muvaffaqiyatli" >> $GITHUB_STEP_SUMMARY
          fi
          exit $kod

      - name: Holatni saqlash
        if: always()
        run: |
          echo "## 💾 Holatni saqlash" >> $GITHUB_STEP_SUMMARY
          git config user.name  "Sofia Expert Bot"
          git config user.email "actions@github.com"
          git add yuborilgan.txt ishlatilgan.txt ishlatilgan_rasmlar.txt jurnal.log || true
          if git diff --staged --quiet; then
            echo "O'zgarish yo'q." >> $GITHUB_STEP_SUMMARY
          else
            git commit -q -m "Post yuborildi: $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull -q --rebase --autostash
            if git push -q; then
              echo "✅ Saqlandi" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ Yozib bo'lmadi. Settings → Actions → Workflow permissions → **Read and write permissions**" >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
          fi
